const clone=x=>JSON.parse(JSON.stringify(x));let data=clone(initial),admin=false,section='home',db=null,session=null,live=false,channel=null,saveTimer=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),attr=x=>esc(x).replace(/`/g,'&#96;');function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(t){$('status').textContent=t;setTimeout(status,2300)}function status(){$('status').textContent=live?'● En línea · sincronización activa':'Demostración local'}function img(src,cls=''){return src?`<img class="${cls}" src="${attr(src)}" alt="Imagen de NOVA AURA 67" onerror="this.style.display='none'">`:''}function date(s){return s?new Date(s+'T12:00:00').toLocaleDateString('es-EC',{day:'numeric',month:'short',year:'numeric'}):''}function paintTheme(){document.documentElement.style.setProperty('--sky',data.settings.primary||'#79c7e6');document.documentElement.style.setProperty('--gold',data.settings.secondary||'#cfa34e');$('brand').textContent=data.settings.name||'NOVA AURA 67';$('headerLogo').outerHTML=data.settings.logo?'<img id="headerLogo" class="brand-logo" src="'+attr(data.settings.logo===OFFICIAL_LOGO?OFFICIAL_ICON:data.settings.logo)+'" alt="Logo">':'<span id="headerLogo" class="symbol">✦</span>'}function saveLocal(){localStorage.setItem('nova_aura_67_app_v1_6',JSON.stringify(data))}
function goto(s){section=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function navs(){return [['home','⌂ Inicio'],['proposal','✦ Propuesta'],['candidates','♙ Candidatos'],['polls','☑ Encuestas'],['news','▤ Noticias'],['commitments','⚑ Compromisos'],['gallery','▧ Galería'],['activities','▦ Calendario']]}
function render(){paintTheme();$('nav').innerHTML=navs().map(([id,label])=>`<button class="${section===id?'active':''}" onclick="goto('${id}')">${label}</button>`).join('');$('page').innerHTML=renderPublic();status()}
function renderPublic(){switch(section){case 'home':return `<div class="card marble hero">${img(data.settings.logo,'banner')||'<div class="symbol" style="width:116px;height:116px;font-size:75px">✦</div>'}<h1>${esc(data.settings.name)}</h1><p>${esc(data.settings.slogan).toUpperCase()}</p><button class="gold" onclick="goto('proposal')">Conoce nuestra propuesta →</button></div><div class="grid">${[['proposal','Propuesta'],['candidates','Candidatos'],['polls','Encuestas'],['news','Noticias']].map(([id,t])=>`<button class="secondary" onclick="goto('${id}')">${t}</button>`).join('')}</div>`;case 'proposal':return `<div class="card marble"><h2>JUNTOS HACEMOS LA DIFERENCIA</h2><p>Ideas reales, estudiantes reales, resultados reales.</p></div>${[['◎','Misión',data.proposal.mission],['◉','Visión',data.proposal.vision],['♡','Valores',data.proposal.values],['✦','Identidad y símbolo',data.proposal.identity],['★','Lema de campaña',data.proposal.campaign]].map(([i,t,v])=>`<div class="card"><h3>${i} ${t}</h3><p>${esc(v)}</p></div>`).join('')}`;case 'candidates':return `<div class="card marble"><h2>NUESTRO EQUIPO</h2><p>Conoce a los candidatos que forman NOVA AURA 67</p><div class="grid">${data.candidates.map(p=>`<div class="person item">${p.image?img(p.image):'<div class="avatar">♙</div>'}<h3>${esc(p.role)}</h3><small>${esc(p.name)}</small></div>`).join('')}</div><p style="text-align:center;color:#a98335">❝ Ideas reales, estudiantes reales, resultados reales. ❞</p></div>`;case 'polls':return `<div class="card marble"><h2>ENCUESTAS</h2><p>Tu opinión cuenta</p></div>${data.polls.filter(p=>p.status==='active').map(p=>`<div class="card"><h3>${esc(p.title)}</h3><p class="tiny">${p.mode==='multiple'?'Puedes elegir varias opciones':'Selecciona una opción'}</p><form onsubmit="vote(event,'${p.id}')">${p.options.map((o,i)=>`<label class="pollopt"><input type="${p.mode==='multiple'?'checkbox':'radio'}" name="opt-${p.id}" value="${i}" ${p.mode==='multiple'?'':'required'}> ${esc(o)}</label>`).join('')}<button type="submit">Votar</button></form>${voteResult(p)}</div>`).join('')||'<div class="card">No hay encuestas activas.</div>'}`;case 'news':return `<div class="card marble"><h2>NOVEDADES</h2></div>${data.news.filter(n=>n.published).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<article class="card newsrow">${n.image?img(n.image,'newsimg'):'<div class="newsimg" style="display:grid;place-items:center;font-size:35px">▤</div>'}<div><h3>${esc(n.title)}</h3><small>${date(n.date)}</small><p>${esc(n.description||'')}</p></div></article>`).join('')}`;case 'commitments':return `<div class="card marble"><h2>NUESTROS COMPROMISOS</h2><p>Propuestas, avances y resultados</p></div>${data.commitments.map(c=>`<div class="card"><div class="adminbar"><strong>✦ ${esc(c.title)}</strong><b>${Number(c.progress)||0}%</b></div>${c.description?`<p>${esc(c.description)}</p>`:''}<div class="progress" style="margin-top:10px"><span style="width:${Math.max(0,Math.min(100,Number(c.progress)||0))}%"></span></div>${c.evidence?`<p class="tiny">Evidencia: <a target="_blank" rel="noopener noreferrer" href="${attr(safeUrl(c.evidence))}">Ver soporte</a></p>`:''}</div>`).join('')}`;case 'activities':return `<div class="card marble"><h2>PLAN DE ACTIVIDADES</h2><p>Fechas propuestas, sujetas a coordinación y confirmación institucional.</p></div>${(data.activities||[]).map(a=>`<article class="card"><span class="tag">${date(a.date)} · ${esc(a.status||'propuesta')}</span><h3>${esc(a.title)}</h3><p>${esc(a.description)}</p></article>`).join('')}`;case 'gallery':return `<div class="card marble"><h2>GALERÍA</h2><div class="gallery">${data.gallery.map(g=>`<div class="item">${img(g.image)}<p>${esc(g.title)}</p></div>`).join('')||'No hay imágenes publicadas.'}</div></div>`;default:return ''}}
function voteResult(p){let r=live?(p.liveResults||p.results):p.results;return `<div class="item"><strong>Resultados ${live?'registrados':'de demostración'}</strong>${p.options.map((o,i)=>`<div class="adminbar tiny"><span>${esc(o)}</span><span>${Number(r[i]||0)}${live?' votos':'%'}</span></div><div class="progress"><span style="width:${live?(Math.max(...r,1)?100*(r[i]||0)/Math.max(...r,1):0):r[i]||0}%"></span></div>`).join('')}</div>`}
function safeUrl(v){try{let u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return ''}}function safeImage(v){v=v.trim();return v.startsWith('data:image/png;base64,')||v.startsWith('data:image/jpeg;base64,')?v:safeUrl(v)}async function vote(e,id){e.preventDefault();let p=data.polls.find(x=>x.id===id),values=[...e.target.querySelectorAll('input:checked')].map(x=>Number(x.value));if(!p||!values.length)return;let key='nova_voted_'+id;if(localStorage.getItem(key))return alert('Este navegador ya participó en esta encuesta.');if(live){try{let token=localStorage.getItem('nova_voter');if(!token){token=uid()+uid();localStorage.setItem('nova_voter',token)}let {error}=await db.rpc('nova_cast_vote',{p_poll_id:id,p_choices:values,p_voter_token:token});if(error)throw error;localStorage.setItem(key,'1');await refreshVotes();toast('Voto registrado');render()}catch(err){alert('No se pudo registrar el voto: '+err.message)}}else{values.forEach(v=>p.results[v]=(p.results[v]||0)+1);localStorage.setItem(key,'1');saveLocal();toast('Voto de demostración');render()}}
async function refreshVotes(){if(!live)return;try{let {data:rows,error}=await db.rpc('nova_vote_totals');if(error)return;data.polls.forEach(p=>{p.liveResults=p.options.map((_,i)=>rows.filter(r=>r.poll_id===p.id&&r.choice_index===i).reduce((s,r)=>s+Number(r.votes),0))})}catch{}}
function loadScript(url){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(Error('No se pudo cargar el cliente de nube'));document.head.append(s)})}

async function loadPublic(){const cfg=window.NOVA_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){status();return}try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const pull=async()=>{let r=await db.from('nova_state').select('payload').eq('id',1).single();if(r.error)throw r.error;if(r.data?.payload){data=r.data.payload;live=true;await refreshVotes();render()}};await pull();channel=db.channel('nova-public').on('postgres_changes',{event:'UPDATE',schema:'public',table:'nova_state',filter:'id=eq.1'},()=>pull().catch(console.warn)).subscribe();setInterval(()=>pull().catch(console.warn),45000)}catch(e){live=false;console.warn('Sin conexión pública:',e.message);render()}}
render();loadPublic();
</script></body></html>
